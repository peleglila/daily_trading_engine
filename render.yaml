# Render Blueprint — API only (frontend stays on GitHub Pages)
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo
services:
  - type: web
    name: peleg-trading-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: ALLOWED_USERS
        sync: false
